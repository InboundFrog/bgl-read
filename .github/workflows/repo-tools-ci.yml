# Managed by repo-tools (bin/repo-ci). Local edits will be overwritten.
# Customise via .github/repo-tools.conf instead: https://github.com/InboundFrog/repo-tools
name: CI

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: InboundFrog/repo-tools/.github/workflows/rust.yml@500e0a8474bc5f01dc50320aa0ec4bb5e680c498 # v0.0.1
    strategy:
      fail-fast: false
      matrix:
        dir: ['.']
    with:
      working-directory: ${{ matrix.dir }}

  shell:
    uses: InboundFrog/repo-tools/.github/workflows/shell.yml@500e0a8474bc5f01dc50320aa0ec4bb5e680c498 # v0.0.1
    strategy:
      fail-fast: false
      matrix:
        dir: ['.']
    with:
      working-directory: ${{ matrix.dir }}

  ci-ok:
    name: CI OK
    if: always()
    needs: [rust, shell]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
